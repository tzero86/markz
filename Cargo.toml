[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.77.2"
authors = ["MarkZ Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zero/markz"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"

# Markdown / Parsing
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Frontmatter
yaml-rust2 = "0.10"

# Directories
dirs = "6.0"

# Tauri
tauri = { version = "2.11.1" }
tauri-build = { version = "2.6.1" }

# DOCX Generation
docx-rs = "0.4"

# HTTP Client
ureq = "3"

# Base64 encoding (local image embedding in preview)
base64 = "0.22"
