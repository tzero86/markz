[package]
name = "markz-convert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["docx", "remote-images"]
# DOCX export. `image` stays unconditional — it backs the local-image
# sniffing/decode shared by every converter, not just DOCX.
docx = ["dep:docx-rs"]
# Downloading `http(s)://` images for embedding (off by default at runtime
# too; see `ConvertContext::embed_remote_images`).
remote-images = ["dep:ureq"]

[dependencies]
markz-core = { path = "../markz-core" }
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
docx-rs = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
