[package]
name = "markz"
version.workspace = true
description = "MarkZ — A dual-pane Markdown editor for engineers"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "markz_lib"
crate-type = ["staticlib", "rlib"]

[features]
# Every feature is on by default, so a plain `cargo build` and `cargo test
# --workspace` compile exactly what they did before these flags existed. Turn
# one off explicitly (e.g. `--no-default-features --features pandoc`) to drop
# its dependency; the corresponding commands then stop being registered and
# calling one from the frontend fails with "command not found".
default = ["tts", "git", "watcher", "docx", "remote-images", "pandoc"]
# Text-to-speech: the Edge-TTS websocket client plus its deps.
tts = ["dep:tungstenite", "dep:ureq", "dep:sha2", "dep:uuid"]
# Repository status and diff in the status bar and diff modal.
git = ["dep:git2"]
# Filesystem watching of the workspace tree and open documents.
watcher = ["dep:notify"]
# DOCX export. See `markz-convert`'s own `docx` feature.
docx = ["markz-convert/docx"]
# Fetching `http(s)://` images for embedding. See `markz-convert`'s own
# `remote-images` feature.
remote-images = ["markz-convert/remote-images"]
# Pandoc export/copy. Gates code, not a dependency — it also needs `uuid` for
# its temp-file names.
pandoc = ["dep:uuid"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
tauri = { workspace = true }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
base64 = { workspace = true }
percent-encoding = "2"
ureq = { version = "3", features = ["native-tls", "json"], optional = true }
tungstenite = { version = "0.29", features = ["native-tls"], optional = true }
sha2 = { version = "0.11", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
chrono = "0.4"
tokio = { version = "1", features = ["fs", "process", "io-util"] }

markz-core = { path = "../crates/markz-core" }
markz-convert = { path = "../crates/markz-convert" }
markz-config = { path = "../crates/markz-config" }
markz-images = { path = "../crates/markz-images" }
markz-templates = { path = "../crates/markz-templates" }
dirs.workspace = true
notify = { workspace = true, optional = true }

git2 = { version = "0.20", optional = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_SpeechSynthesis", "Media_Core", "Storage_Streams", "Foundation"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Entry names only — docx is already built with deflate by pandoc, and the
# compressor backends behind zip's default features are not otherwise needed.
zip = { version = "4", default-features = false }
