[package]
name = "markz"
version.workspace = true
description = "MarkZ — A dual-pane Markdown editor for engineers"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "markz_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
tauri = { workspace = true }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
base64 = { workspace = true }
ureq = { version = "3", features = ["native-tls", "json"] }
tungstenite = { version = "0.29", features = ["native-tls"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tokio = { version = "1", features = ["fs", "process", "io-util"] }

markz-core = { path = "../crates/markz-core" }
markz-convert = { path = "../crates/markz-convert" }
markz-config = { path = "../crates/markz-config" }
markz-images = { path = "../crates/markz-images" }
markz-templates = { path = "../crates/markz-templates" }
dirs.workspace = true
notify = { workspace = true }

git2 = "0.20"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_SpeechSynthesis", "Media_Core", "Storage_Streams", "Foundation"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
