<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkZ</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 300ms ease-out;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash .card {
        background: var(--bg-elevated, #ffffff);
        border: 1px solid var(--border-default, #e2e2e2);
        border-radius: 12px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18);
        padding: 40px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        min-width: 320px;
        max-width: 400px;
        text-align: center;
      }
      #splash .logo { width: 72px; height: 72px; border-radius: 14px; }
      #splash .app-name { font-size: 26px; font-weight: 800; color: #0d8a5d; letter-spacing: -0.02em; }
      #splash .tagline { font-size: 13px; color: #6b6b6b; }
      #splash .info { font-size: 11px; color: #a0a0a0; margin-top: 8px; }
      #splash .loading-bar {
        width: 160px;
        height: 3px;
        background: #e8e8e8;
        border-radius: 2px;
        overflow: hidden;
        margin-top: 4px;
      }
      #splash .loading-bar-fill {
        height: 100%;
        width: 40%;
        background: #0d8a5d;
        border-radius: 2px;
        animation: loadPulse 1.2s ease-in-out infinite;
      }
      @keyframes loadPulse {
        0%, 100% { width: 20%; margin-left: 0%; }
        50% { width: 50%; margin-left: 50%; }
      }
      @media (prefers-color-scheme: dark) {
        #splash .card {
          background: #222222;
          border-color: #2a2a2a;
          box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        }
        #splash .app-name { color: #3dd68d; }
        #splash .tagline { color: #a0a0a0; }
        #splash .info { color: #6b6b6b; }
        #splash .loading-bar { background: #323232; }
        #splash .loading-bar-fill { background: #3dd68d; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="card">
        <img class="logo" src="./logo.png" alt="" />
        <span class="app-name">MarkZ</span>
        <span class="tagline">A dual-pane Markdown editor for engineers</span>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
        <span class="info">Built with Tauri &bull; Svelte 5 &bull; Rust</span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
