name: Deploy Site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# After this workflow runs successfully, go to:
# Settings > Pages > Source and select "GitHub Actions"
# The site will be available at: https://tzero86.github.io/markz/
# Note: If using a custom domain, add a CNAME file in the site/ directory.
# The site uses only relative paths and inline assets, so it works on both
# custom domains and the default github.io project page URL.
